<style>
  .subscribe-button {
    background-color: rgb(204, 0, 0);
    color: rgb(255, 255, 255);
    border: none;
    border-radius: 2px;
    cursor: pointer;
    font-size:14px;
    margin-right: 8px;
    padding-bottom: 10px;
    padding-top: 10px;
    padding-left: 16px;
    padding-right: 16px;
    transition: opacity 0.15s;
    vertical-align: top;
  }

  .subscribe-button:hover {
    opacity: 0.7;
  }

  .subscribe-button:active {
    opacity: 0.4;
  }

  .join-button{
    background-color: rgb(255, 255, 255);
    border-color: rgb(6, 95, 212);
    border-style: solid;
    border-radius: 2px;
    border-width:1px;
    color: rgb(6, 95, 212);
    cursor: pointer;
    transition: background-color 0.15s,
    color 0.15s;
    padding-left: 16px;
    padding-right: 16px;
    padding-top: 9.4px;
    padding-bottom: 9.4px;
  }

  .join-button:hover {
    background-color:rgb(6, 95, 212);
    color: rgb(255, 255, 255);
  }

  .join-button:active {
    opacity:0.7;
  }

  .tweet-button{
    background-color: rgb(29, 155, 240);
    color: rgb(255, 255, 255);
    border-radius: 18px;
    border: none;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    margin-left: 8px;
    transition: box-shadow 0.15s;
    vertical-align: top;
    padding-right: 15.5px;
    padding-left: 15.5px;
    padding-top: 9.5px;
    padding-bottom: 9.5px;
  }

  .tweet-button:hover {
    box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.15);
  }

</style>

<button class= "subscribe-button">
  SUBSCRIBE
</button>

<button class= "join-button">
  JOIN
</button>

<button class= "tweet-button">
  Tweet
</button>
