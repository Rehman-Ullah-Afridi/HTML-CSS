<!DOCTYPE html>
<html>

<head>
    <title>Youtube.com Clone</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:ital,wdth,wght@0,75..100,100..900;1,75..100,100..900&display=swap"
        rel="stylesheet">
    <style>
        p {
            font-family: roboto, Arial;
            margin-top: 0px;
            margin-bottom: 0px;
        }

        .thumbnail {
            width: 300px;
        }

        .search-bar {
            font-size: 30px;
            margin-left: 15px;
            display: block;
        }

        .div-element {
            width: 300px;
            display: inline-block;
            margin-left: 10px;
            vertical-align: top;
        }

        .channel-image {
            display: inline-block;
            width: 50px;
            vertical-align: top;
        }

        .profile-image {
            width: 40px;
            border-radius: 30px;
        }

        .video-info {
            display: inline-block;
            width: 200px;
        }

        .video-title {
            margin-top: 0px;
            font-size: 14px;
            font-weight: 500;
            line-height: 20px;
            margin-bottom: 13px;
        }

        .thumbnail-row {
            margin-bottom: 13px;
        }

        .video-author,
        .video-stats {
            font-size: 12px;
            color: rgb(96, 96, 96);
        }

        .video-author {
            margin-bottom: 4px;
        }

    </style>
</head>

<body>
    <input type="text" placeholder="Type Here" class="search-bar">

    <div class="div-element">
        <div class="thumbnail-row">
            <img src="Thumnails/thumbnail-1.webp" class="thumbnail">
        </div>
        <div>
            <div class="channel-image">
                <img src="Channel Images/Image 1.jpeg" class="profile-image">
            </div>
            <div class="video-info">
                <p class="video-title">
                    Talking Tech and AI with Google CEO Sundar Pichai&#x21;
                </p>

                <p class="video-author">
                    Marques Brownlee
                </p>

                <p class="video-stats">
                    3&#x2E;4M views &#xb7; 6 months ago
                </p>
            </div>
        </div>
    </div>

    <div class="div-element">
        <div class="thumbnail-row">
            <img src="Thumnails/thumbnail-2.webp" class="thumbnail">
        </div>
        <div>
            <div class="channel-image">
                <img src="Channel Images/channel-image-2.jpeg" class="profile-image">
            </div>
            <div class="video-info">
                <p class="video-title">
                Try Not To Laugh Challenge #9
            </p>

            <p class="video-author">
                Markiplier
            </p>

            <p class="video-stats">
                19M views views &#xb7; 4 years ago
            </p>
            </div>
        </div>
    </div>
</body>

</html>
