<!DOCTYPE html>
<html>
    <head>
        <title>
            1st Problem
        </title>
        <link rel="stylesheet" href="Problem 1.css">
    </head>
    <body>
        <div class="header">
        <div class="left-section">
            <img src="Icons/hamburger-menu.svg" class="hamburger-menu-icon">
            <img src="Icons/youtube-logo.svg" class="youtube-logos-icon">
        </div>
        <div class="middle-section">
            <input type="text" placeholder="Search" class="search-bar">
            <button class="search-button">
                <img src="Icons/search.svg" class="search-icon">
                <div class="tooltip">Search</div>
            </button>
            <button class="voice-button">
                <img src="Icons/voice-search-icon.svg" class="voice-icon">
                <div class="tooltip">Search with Your Voice</div>
            </button>
        </div>
        <div class="right-section">
            <div class="upload-icon-container">
                <img src="Icons/upload.svg" class="upload-icon">
                <div class="tooltip">Create</div>
            </div>
            <div class="youtube-apps-icon-container">
                <img src="Icons/youtube-apps.svg" class="youtube-apps-icon">
                <div class="tooltip">YouTube apps</div>
            </div>
            
            <div class="notifications-icon-container">
                <img src="Icons/notifications.svg" class="notifications-icon">
                <div class="notifications-count">3</div>
                <div class="tooltip">Notifications</div>
            </div>
            <img src="Channel Images/my-channel.jpeg" class="my-channel-icon">
        </div>
    </div>
    </body>
</html>
